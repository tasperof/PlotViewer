<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>GLB Viewer with Focus Areas</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/examples/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
 </head>
<body>
  <div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">...Loading Scene...</div>
</div>

  <div id="app"></div>
  <div id="ui">
    <div><strong>Controls:</strong><br>
      1 finger / left click to Rotate<br>
      Pinch / Scroll = Zoom<br>
      2 finger / right click to drag
    </div>
    <button id="resetBtn">Reset Camera</button>
  </div>

 <script type="module" src="./app.js"></script>

</body>
</html>
